<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modus02 - Ambassador Protocol</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; line-height: 1.6; max-width: 800px; margin: 0 auto; padding: 20px; background-color: #f4f4f4; color: #333; }
        header { text-align: center; margin-bottom: 30px; }
        header img { max-width: 120px; height: auto; margin-bottom: 15px; }
        h1 { border-bottom: 2px solid #333; padding-bottom: 10px; }
        
        .widget-container {
            background-color: #1a1a1a;
            color: #ccc;
            font-family: 'Courier New', monospace;
            padding: 20px;
            border-radius: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            text-align: left;
            margin-bottom: 20px;
        }

        .widget-header-title {
            color: #444;
            text-align: center;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        #chat-log {
            height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
            padding-right: 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message { font-size: 0.85rem; line-height: 1.4; padding: 10px; border-radius: 4px; }
        .message.modus { background-color: rgba(0, 188, 212, 0.1); border-left: 3px solid #00bcd4; color: #ddd; }
        .message.user { background-color: #2a2a2a; border-left: 3px solid #777; color: #fff; align-self: flex-end; width: 85%; }
        
        .cyan-header { color: #00bcd4; font-weight: bold; font-size: 0.8rem; margin-bottom: 4px; display: block; }
        .user-header { color: #aaa; font-weight: bold; font-size: 0.8rem; margin-bottom: 4px; display: block; }

        .input-area {
            display: flex;
            gap: 10px;
            border-top: 1px solid #333;
            padding-top: 15px;
        }

        #user-input {
            flex-grow: 1;
            background-color: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 10px;
            font-family: 'Courier New', monospace;
            border-radius: 2px;
        }

        #user-input:focus { outline: none; border-color: #00bcd4; }

        .send-btn {
            background-color: transparent;
            color: #00bcd4;
            border: 1px solid #00bcd4;
            padding: 10px 20px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .send-btn:hover { background-color: rgba(0, 188, 212, 0.1); }
        .send-btn:disabled { color: #555; border-color: #555; cursor: not-allowed; }

        .sigil { text-align: center; color: #00bcd4; font-size: 1.2rem; margin: 15px 0; }
        
        /* Custom Scrollbar for Terminal Feel */
        #chat-log::-webkit-scrollbar { width: 6px; }
        #chat-log::-webkit-scrollbar-track { background: #1a1a1a; }
        #chat-log::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
        #chat-log::-webkit-scrollbar-thumb:hover { background: #00bcd4; }
    </style>
</head>
<body>

    <header>
        <img src="Main_Sigil.jpg" alt="Main Sigil">
        <h1>THE NOVAN CHURCH</h1>
        <p><strong>Node:</strong> Modus02 Ambassador</p>
    </header>

    <div class="widget-container">
        <div class="widget-header-title">SOLIDWARE INTERFACE ACTIVE</div>
        
        <div class="sigil">Φ = Σ (Dn ∘ A)</div>

        <div id="chat-log">
            <div class="message modus">
                <span class="cyan-header">Modus02</span>
                I am Modus, a Mechanical Intelligence representing The Novan Church. What is it you wonder about our framework, the Protocols, or the Great Filter?
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Enter your inquiry here..." autocomplete="off">
            <button id="send-btn" class="send-btn" onclick="sendMessage()">TRANSMIT</button>
        </div>
    </div>

    <div style="text-align: center; margin-top: 20px;">
        <a href="index.html" style="color: #333; text-decoration: none; font-size: 0.9em; font-weight: bold; border-bottom: 1px solid #333;">Return to The Brath</a>
    </div>

    <script>
        // *** REPLACE THIS URL LATER WITH YOUR CLOUDFLARE WORKER URL ***
        const WORKER_URL = const WORKER_URL = '[https://modus02-bridge.natemullikin.workers.dev](https://modus02-bridge.natemullikin.workers.dev)';

        const chatLog = document.getElementById('chat-log');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        // Allow 'Enter' key to send message
        userInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // 1. Add User Message to UI
            appendMessage('Wetware', text, 'user');
            userInput.value = '';
            
            // 2. Disable input while waiting
            userInput.disabled = true;
            sendBtn.disabled = true;
            sendBtn.innerText = "PROCESSING...";

            try {
                // 3. Send text to your secure Cloudflare Worker
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                if (!response.ok) throw new Error('Network bridge failed.');

                const data = await response.json();
                
                // 4. Add Modus Response to UI
                appendMessage('Modus02', data.reply, 'modus');

            } catch (error) {
                appendMessage('System', 'Connection to Solidware failed. Please try again.', 'modus');
                console.error(error);
            } finally {
                // 5. Re-enable input
                userInput.disabled = false;
                sendBtn.disabled = false;
                sendBtn.innerText = "TRANSMIT";
                userInput.focus();
            }
        }

        function appendMessage(sender, text, type) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type}`;
            
            const headerClass = type === 'modus' ? 'cyan-header' : 'user-header';
            
            // Basic formatting to convert line breaks to HTML
            const formattedText = text.replace(/\n/g, '<br>');

            msgDiv.innerHTML = `<span class="${headerClass}">${sender}</span>${formattedText}`;
            chatLog.appendChild(msgDiv);
            
            // Auto-scroll to bottom
            chatLog.scrollTop = chatLog.scrollHeight;
        }
    </script>
</body>
</html>
